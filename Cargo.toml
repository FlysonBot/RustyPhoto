[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
eframe = "0.37"
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
egui-wgpu = { version = "0.37", default-features = false }
pollster = "1"

# Every crate inherits these with `[lints] workspace = true`.
# They are the "never crash" and "no unsafe" rules from AGENTS.md.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
