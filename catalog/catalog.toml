# The feature catalog: the WHOLE target product, written down as data.
#
# Every feature the finished editor should have gets one entry with a stable id.
# An entry is "live" when a command with the same id exists in the engine
# (crates/editor-engine/src/cmd/). Missing entries show greyed out in the menus.
# `cargo xtask catalog` writes coverage to docs/generated/coverage.md.
#
# Rules:
# - Ids never change once used. Format: area.group.name, lowercase, dots.
#   Labels and shortcuts may change; ids may not.
# - Product names of other software never appear in labels (a test checks).
# - App-shell actions (undo, redo, quit) are built into the app, not listed here.
# - Entries appear in menus in file order.
# - `kind`: command (default, has a `menu`), tool (toolbar), panel (a panel
#   button or panel-menu action), key (keyboard only), format (file format).
# - Shortcuts use `Ctrl` (shown as Cmd on macOS). A shortcut belongs to one
#   entry only, except tools: tools sharing a letter form one flyout group.
# - Adding, removing or regrouping entries is the architect's job.


